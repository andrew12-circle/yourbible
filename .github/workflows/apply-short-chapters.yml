name: Apply short-chapter correction
on:
  push:
    branches: [fix/reader-short-chapter-continuation]
    paths: [.github/workflows/apply-short-chapters.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply the checksummed reader source patch on the repair branch
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/fix/reader-short-chapter-continuation
          cat scripts/.short-chapters-0*.b64 | base64 --decode | gzip --decompress > "$RUNNER_TEMP/short.patch"
          echo "79247181a8427f648b7e19a7909115b9ee1a6f2092025febeee3549c225160c4  $RUNNER_TEMP/short.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/short.patch"
          git apply "$RUNNER_TEMP/short.patch"
          git add -- src scripts/test-bible-chapter-continuation.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fill short-chapter Bible spreads and move attribution into Settings'
          test "$(git ls-remote origin refs/heads/fix/reader-short-chapter-continuation | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/fix/reader-short-chapter-continuation
