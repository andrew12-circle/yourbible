name: Import reviewed visual collections
on:
  push:
    branches: ['feat/masterworks-atlas-collections']
    paths: ['.github/workflows/import-reviewed-collections.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: reviewed-collection-import
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/feat/masterworks-atlas-collections'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: visual-final-review
          run-id: 36013932342
          github-token: ${{ github.token }}
          path: visual-review
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-collection-import
          run-id: 36020109334
          github-token: ${{ github.token }}
          path: import-resume
      - name: Restore verified acquisition checkpoint
        run: |
          checkpoint=$(find import-resume -path '*/public/visual-bible/v1/manifest.json' -type f -print -quit)
          test -n "$checkpoint"
          cp -a "$(dirname "$checkpoint")/." public/visual-bible/v1/
      - name: Prepare reviewed source decisions and bounded derivatives
        run: |
          node scripts/visual-bible/apply-import-compat.mjs
          node scripts/visual-bible/apply-bounded-images.mjs
          node scripts/visual-bible/prepare-reviewed.mjs
      - name: Recheck source identity and rights
        run: node scripts/visual-bible/import-reviewed.mjs 2>&1 | tee "$RUNNER_TEMP/collection-import.log"
      - name: Resume approved images without exceeding reader file limits
        run: |
          node scripts/acquire-visual-bible.mjs 2>&1 | tee "$RUNNER_TEMP/collection-acquire.log"
          node scripts/acquire-visual-bible.mjs --verify
      - name: Commit only reviewed catalogue and verified derivatives
        run: |
          git fetch origin feat/masterworks-atlas-collections
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/visual-bible/v1
          git add src/data/visualBible/collectionExpansion.json scripts/visual-bible/approved-selections.json docs/visual-bible/acquisition-review.json scripts/visual-bible/import-reviewed.mjs scripts/visual-bible/discover.mjs scripts/visual-bible/art-place-review.mjs scripts/acquire-visual-bible.mjs
          git commit -m 'Publish source-reviewed collection with verified first-party image derivatives'
          git push origin HEAD:refs/heads/feat/masterworks-atlas-collections
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-collection-import
          retention-days: 14
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/collection-*.log
            src/data/visualBible/collectionExpansion.json
            scripts/visual-bible/approved-selections.json
            docs/visual-bible/acquisition-review.json
            public/visual-bible/v1
