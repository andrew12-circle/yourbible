name: Bible book openings
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/test-bible-book-openings.mjs'
      - '.github/workflows/bible-book-openings.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/bible/**'
      - 'src/hooks/use*Passages.ts'
      - 'src/hooks/useReader*.ts'
      - 'src/components/bible/ReaderBookOpening*'
      - 'src/components/bible/readerBookOpening.css'
      - 'src/pages/reader/**'
      - 'scripts/test-bible-book-openings.mjs'
      - '.github/workflows/bible-book-openings.yml'
permissions:
  contents: read
concurrency:
  group: book-openings-${{ github.ref }}
  cancel-in-progress: true
jobs:
  openings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Book boundaries and local introductions
        run: npx vitest run src/lib/bible/readerBookBoundary.test.ts src/lib/bible/readerContinuation.test.ts src/lib/bible/readerWindowFlow.test.ts src/components/bible/ReaderBookOpening.test.tsx
      - name: Browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/opening-tools" --no-save playwright
          "$RUNNER_TEMP/opening-tools/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Actual book turns, visible words and opening typography
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/opening-tools/node_modules/playwright/index.mjs
          READER_BROWSER: ${{ matrix.browser }}
        run: node scripts/test-bible-book-openings.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-opening-${{ matrix.browser }}
          path: |
            ${{ runner.temp }}/book-opening-*.json
            ${{ runner.temp }}/book-opening-*.png
            ${{ runner.temp }}/mark-opening-*.png
            ${{ runner.temp }}/matthew-ending-*.png
