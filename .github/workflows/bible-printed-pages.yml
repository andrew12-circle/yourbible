name: Printed Bible pages
on:
  push:
    branches: [main, fix/true-book-pages]
    paths: ['src/**', 'scripts/*bible*', 'scripts/reader-browser-text.mjs', 'scripts/reader-print-geometry.mjs', '.github/workflows/bible-printed-pages.yml']
  pull_request:
    paths: ['src/**', 'scripts/*bible*', 'scripts/reader-browser-text.mjs', 'scripts/reader-print-geometry.mjs', '.github/workflows/bible-printed-pages.yml']
permissions:
  contents: read
concurrency:
  group: printed-bible-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: reader-test-placeholder
  VITE_SUPABASE_ANON_KEY: reader-test-placeholder
defaults:
  run:
    shell: bash
jobs:
  printed-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/reader-playwright" --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/reader-playwright/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Mark artwork, both columns, exact words and chapter turns
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/reader-playwright/node_modules/playwright/index.mjs
          READER_BROWSER: ${{ matrix.browser }}
          READER_TEST_BOOK: Mrk
          READER_TEST_CHAPTER: '3'
          READER_TEST_END_CHAPTER: '6'
        run: node scripts/test-bible-chapter-continuation.mjs 2>&1 | tee "$RUNNER_TEMP/printed-bible.log"
      - name: Print typography and number alignment in Proverbs and prose
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/reader-playwright/node_modules/playwright/index.mjs
          READER_BROWSER: ${{ matrix.browser }}
          READER_PRINT_CHECKS: '1'
        run: |
          READER_TEST_BOOK=Pro READER_TEST_CHAPTER=3 READER_TEST_END_CHAPTER=6 node scripts/test-bible-chapter-continuation.mjs 2>&1 | tee "$RUNNER_TEMP/print-proverbs.log"
          READER_TEST_BOOK=Gen READER_TEST_CHAPTER=3 READER_TEST_END_CHAPTER=5 node scripts/test-bible-chapter-continuation.mjs 2>&1 | tee "$RUNNER_TEMP/print-prose.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: printed-bible-${{ matrix.browser }}
          path: |
            ${{ runner.temp }}/chapter-flow*.png
            ${{ runner.temp }}/chapter-flow*.json
            ${{ runner.temp }}/printed-bible.log
            ${{ runner.temp }}/print-*.log
