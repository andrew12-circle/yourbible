name: Stage transcript-only study
on:
  push:
    branches: ['fix/artifact-transcript-only-study']
    paths: ['.github/transcript-only-transfer/**']
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'andrew12-circle/yourbible'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/artifact-transcript-only-study
          fetch-depth: 0
      - name: Apply verified source patch and remove transfer files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = fb2d3a2e6676fd97d8073d74b6b648b23536c04f
          cat .github/transcript-only-transfer/*.b64 | base64 --decode > "$RUNNER_TEMP/transcript-only.patch.gz"
          echo "f856f76bf50f4bcb90990d2cef762aee9080b0b36ece532057ce979fe26adf05  $RUNNER_TEMP/transcript-only.patch.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/transcript-only.patch.gz" > "$RUNNER_TEMP/transcript-only.patch"
          git apply --check "$RUNNER_TEMP/transcript-only.patch"
          git apply "$RUNNER_TEMP/transcript-only.patch"
          git rm -r .github/transcript-only-transfer .github/workflows/transcript-only-stage.yml
          git add src docs/transcript-only-study.md
          git diff --cached --check
          git config user.name 'Andrew Heisley'
          git config user.email 'andrew@heisleyteam.com'
          git commit -m 'fix(artifacts): keep saved transcripts useful without AI providers' -m 'Add source-scoped local excerpt selection, explicit Scripture reference detection, worker isolation, nonblocking analysis warnings and regression tests. Preserve all saved findings and research. No provider calls or database migrations.'
          git push origin HEAD:fix/artifact-transcript-only-study
