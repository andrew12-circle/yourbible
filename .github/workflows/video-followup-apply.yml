name: Apply video reliability follow-up
on:
  push:
    branches: [fix/journal-video-finalization-20260919]
    paths: ['.github/workflows/video-followup-apply.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: journal-test-placeholder
      VITE_SUPABASE_ANON_KEY: journal-test-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact source-checked changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,json
          parts=sorted(Path('scripts').glob('video-followup-transfer.part-*'))
          assert len(parts)==3
          raw=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts)))
          assert hashlib.sha256(raw).hexdigest()=='630981f081bd7d4872327e8c64461603e328d9f56d0e921729683f6d513379ae'
          changes={}
          for name,patch in json.loads(raw).items():
              path=Path(name)
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] in ['src','scripts','docs']
              old=path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(old).hexdigest()==patch['base'], 'Source changed: '+name
              lines=old.decode().splitlines(keepends=True)
              for start,end,text in reversed(patch['edits']):
                  lines[start:end]=text.splitlines(keepends=True)
              changes[path]=''.join(lines)
          for path,text in changes.items():
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(text)
          PY
          git rm scripts/video-followup-transfer.part-*
          git add src scripts docs
          git diff --cached --check
          git -c user.name='Andrew Heisley' -c user.email='andrew12-circle@users.noreply.github.com' commit -m 'fix(journal): isolate video saves and protect delayed recording finalization'
          git push origin HEAD:fix/journal-video-finalization-20260919
      - run: npm ci
      - name: Full repository tests
        id: tests
        continue-on-error: true
        run: npm test 2>&1 | tee "$RUNNER_TEMP/video-followup-tests.log"
      - name: Type regression comparison
        id: types
        continue-on-error: true
        run: node scripts/check-journal-type-regressions.mjs 4cc5340af1c90c072f33005fc4e16d28a7a7ea09 2>&1 | tee "$RUNNER_TEMP/video-followup-types.log"
      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/video-followup-build.log"
      - name: Repository lint
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee "$RUNNER_TEMP/video-followup-lint.log"
      - name: Browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-save --package-lock=false playwright@1.55.1
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          node "$RUNNER_TEMP/browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Recorder, storage failure and cross-tab scenarios
        id: browser
        continue-on-error: true
        run: node scripts/test-journal-video-stability.mjs 2>&1 | tee "$RUNNER_TEMP/video-followup-browser.log"
      - name: Existing captions and editor stability
        id: editor
        continue-on-error: true
        run: |
          node scripts/test-journal-captions.mjs 2>&1 | tee "$RUNNER_TEMP/video-followup-captions.log"
          node scripts/test-journal-editor-scroll.mjs 2>&1 | tee "$RUNNER_TEMP/video-followup-editor.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-followup-validation
          path: |
            ${{ runner.temp }}/video-followup-*.log
            ${{ runner.temp }}/journal-video-*
            ${{ runner.temp }}/journal-type*.log
          if-no-files-found: ignore
      - name: Require every validation gate
        if: always()
        run: |
          test '${{ steps.tests.outcome }}' = success
          test '${{ steps.types.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
          test '${{ steps.lint.outcome }}' = success
          test '${{ steps.browser.outcome }}' = success
          test '${{ steps.editor.outcome }}' = success
