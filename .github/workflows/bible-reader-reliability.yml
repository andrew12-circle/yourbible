name: Bible reader reliability
on:
  push:
    branches: [main, 'fix/bible-reader-stability']
    paths: ['src/**', 'supabase/functions/_shared/parsePassageHtml.ts', 'scripts/test-bible-reader.mjs', '.github/workflows/bible-reader-reliability.yml', 'package*.json']
  pull_request:
    paths: ['src/hooks/usePassage*', 'src/hooks/useReader*', 'src/components/bible/**', 'src/pages/reader/**', 'src/lib/bible/**', 'scripts/test-bible-reader.mjs', '.github/workflows/bible-reader-reliability.yml']
permissions:
  contents: read
env:
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: reader-test-placeholder
  VITE_SUPABASE_ANON_KEY: reader-test-placeholder
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Full repository lint
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee "$RUNNER_TEMP/reader-lint.log"
      - name: Full repository tests
        id: tests
        continue-on-error: true
        run: npm test 2>&1 | tee "$RUNNER_TEMP/reader-tests.log"
      - name: Production build and distribution safeguards
        id: build
        continue-on-error: true
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/reader-build.log"
      - name: No new TypeScript diagnostics
        id: types
        continue-on-error: true
        run: node scripts/check-journal-type-regressions.mjs 46391e6a3e940133e596bba2850eb34911a4370a 2>&1 | tee "$RUNNER_TEMP/reader-types.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bible-reader-regression
          path: ${{ runner.temp }}/reader-*.log
      - name: Require all verification steps
        if: always()
        run: test '${{ steps.lint.outcome }}' = success && test '${{ steps.tests.outcome }}' = success && test '${{ steps.build.outcome }}' = success && test '${{ steps.types.outcome }}' = success
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/reader-playwright" --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/reader-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real reader browser regressions with provider requests mocked
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/reader-playwright/node_modules/playwright/index.mjs
        run: node scripts/test-bible-reader.mjs 2>&1 | tee "$RUNNER_TEMP/reader-browser.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bible-reader-browser
          path: |
            ${{ runner.temp }}/reader-browser.log
            ${{ runner.temp }}/bible-reader-*.png
            ${{ runner.temp }}/bible-reader-results.json
