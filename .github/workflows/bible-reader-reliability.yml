name: Bible reader reliability
on:
  push:
    branches: ['fix/bible-reader-stability']
permissions:
  contents: write
env:
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: reader-test-placeholder
  VITE_SUPABASE_ANON_KEY: reader-test-placeholder
jobs:
  regression:
    if: github.ref == 'refs/heads/fix/bible-reader-stability'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact-context source integration on the repair branch
        run: |
          python3 scripts/apply-bible-reader-repair.py
          git diff --check
          git config user.name 'Reader reliability repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src supabase/functions/_shared/parsePassageHtml.ts docs/bible-reader-reliability.md scripts/apply-bible-reader-repair.py
          git restore -- .github/workflows/bible-reader-reliability.yml
          git commit -m 'fix(reader): integrate stable chapter identity, measured pages, and reading anchors'
          git push origin HEAD:fix/bible-reader-stability
          git rev-parse HEAD
      - run: npm ci
      - name: Full repository lint
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee "$RUNNER_TEMP/reader-lint.log"
      - name: Full repository tests
        id: tests
        continue-on-error: true
        run: npm test 2>&1 | tee "$RUNNER_TEMP/reader-tests.log"
      - name: Production build and distribution safeguards
        id: build
        continue-on-error: true
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/reader-build.log"
      - name: No new TypeScript diagnostics
        id: types
        continue-on-error: true
        run: node scripts/check-journal-type-regressions.mjs 46391e6a3e940133e596bba2850eb34911a4370a 2>&1 | tee "$RUNNER_TEMP/reader-types.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bible-reader-regression
          path: ${{ runner.temp }}/reader-*.log
      - name: Require all verification steps
        if: always()
        run: test '${{ steps.lint.outcome }}' = success && test '${{ steps.tests.outcome }}' = success && test '${{ steps.build.outcome }}' = success && test '${{ steps.types.outcome }}' = success
