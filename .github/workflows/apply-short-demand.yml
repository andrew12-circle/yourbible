name: Apply measured continuation demand fix
on:
  push:
    branches: [fix/reader-short-chapter-continuation]
    paths: [.github/workflows/apply-short-demand.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/fix/reader-short-chapter-continuation
          base64 --decode scripts/.short-demand.b64 | gzip --decompress > "$RUNNER_TEMP/demand.patch"
          echo "cc44f463e76cb603ae9f6a11f1544a591d7e1b968f104d98b03e9d2f1448f351  $RUNNER_TEMP/demand.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/demand.patch"
          git apply "$RUNNER_TEMP/demand.patch"
          git add -- src/hooks/useReaderContinuation.ts src/hooks/useReaderContinuation.test.tsx src/pages/reader/ReaderPage.tsx
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Recheck continuation after every measured layout and guard optimistic loading'
          test "$(git ls-remote origin refs/heads/fix/reader-short-chapter-continuation | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/fix/reader-short-chapter-continuation
