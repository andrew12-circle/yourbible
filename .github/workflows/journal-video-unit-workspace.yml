name: Journal video isolated test dependencies
on:
  push:
    branches: [fix/journal-video-stability-20260919]
    paths: ['.github/workflows/journal-video-unit-workspace.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm install --no-save --package-lock=false --ignore-scripts tus-js-client@4.3.1 playwright@1.55.1
      - run: tar -czf "$RUNNER_TEMP/journal-video-dependencies.tar.gz" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: journal-video-test-dependencies
          path: ${{ runner.temp }}/journal-video-dependencies.tar.gz
          retention-days: 1
