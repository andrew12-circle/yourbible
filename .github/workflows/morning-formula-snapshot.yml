name: Morning Formula source snapshot
on:
  push:
    branches: [fix/journal-morning-formula-flow]
    paths: [.github/workflows/morning-formula-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz -o /tmp/morning-formula-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: morning-formula-source
          path: /tmp/morning-formula-source.tar.gz
          retention-days: 1
