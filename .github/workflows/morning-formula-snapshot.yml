name: Morning Formula source snapshot
on:
  push:
    branches: [fix/journal-morning-formula-flow]
    paths: [.github/workflows/morning-formula-snapshot.yml]
permissions:
  contents: read
concurrency:
  group: morning-formula-source
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only, without media assets
        run: git archive --format=tar.gz -o /tmp/morning-formula-source.tar.gz HEAD src supabase scripts AGENTS.md package.json package-lock.json .github
      - uses: actions/upload-artifact@v4
        with:
          name: morning-formula-source
          path: /tmp/morning-formula-source.tar.gz
          retention-days: 1
