name: Transcript-only study browser checks
on:
  pull_request:
    paths:
      - 'src/lib/framework/transcriptOnlyStudy*'
      - 'src/hooks/useTranscriptOnlyStudy*'
      - 'src/components/framework/artifact-detail/ArtifactTranscript*'
      - 'src/components/framework/artifact-detail/ArtifactDetailProcessingState*'
      - 'scripts/test-transcript-only-browser.mjs'
      - '.github/workflows/transcript-only-study.yml'
permissions:
  contents: read
concurrency:
  group: transcript-only-study-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-save --package-lock=false playwright@1.55.1
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          node "$RUNNER_TEMP/browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Compiled local worker, phone layout and offline fallback
        run: node scripts/test-transcript-only-browser.mjs 2>&1 | tee "$RUNNER_TEMP/transcript-only-browser.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transcript-only-browser-results
          path: ${{ runner.temp }}/transcript-only-*
