name: Morning Formula isolated workspace
on:
  push:
    branches: ['feat/morning-formula-calm-session']
    paths: ['.github/workflows/morning-formula-workspace.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: tar -czf "$RUNNER_TEMP/morning-formula-dependencies.tgz" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: morning-formula-dependencies
          path: ${{ runner.temp }}/morning-formula-dependencies.tgz
          retention-days: 1
