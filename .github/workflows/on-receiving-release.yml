name: On Receiving release checks
on:
  pull_request:
    paths:
      - 'src/components/prayer/**'
      - 'src/pages/prayer/**'
      - 'src/lib/prayer/**'
      - 'src/hooks/useBeStillSession*'
      - 'src/App.tsx'
      - 'src/lib/mini-phone/miniPhoneRouter.tsx'
      - '.github/workflows/on-receiving-release.yml'
permissions:
  contents: read
concurrency:
  group: on-receiving-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Full test suite
        run: npm run test
      - name: Production build
        run: npm run build
