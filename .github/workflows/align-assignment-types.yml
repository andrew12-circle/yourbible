name: Align immutable assignment normalization
on:
  push:
    branches: [fix/reader-short-chapter-continuation]
    paths: [.github/workflows/align-assignment-types.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/fix/reader-short-chapter-continuation
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/livingHope/morningRitual.ts')
          text=p.read_text()
          old='  let daily_assignment = emptyDailyAssignment();'
          assert text.count(old)==1
          p.write_text(text.replace(old,'  const daily_assignment = emptyDailyAssignment();'))
          PY
          git add -- src/lib/livingHope/morningRitual.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep the normalized assignment object binding immutable'
          test "$(git ls-remote origin refs/heads/fix/reader-short-chapter-continuation | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/fix/reader-short-chapter-continuation
