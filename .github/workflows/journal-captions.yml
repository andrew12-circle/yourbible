name: Journal caption browser checks
on:
  push:
    branches: [main, 'fix/journal-*']
    paths: ['src/**', 'scripts/test-journal-captions.mjs', 'scripts/test-journal-editor-scroll.mjs', 'package*.json', '.github/workflows/journal-captions.yml']
  pull_request:
    paths: ['src/**', 'scripts/test-journal-captions.mjs', 'scripts/test-journal-editor-scroll.mjs', 'package*.json', '.github/workflows/journal-captions.yml']
permissions:
  contents: read
concurrency:
  group: journal-captions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: journal-test-placeholder
      VITE_SUPABASE_ANON_KEY: journal-test-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-save --package-lock=false playwright@1.55.1
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          node "$RUNNER_TEMP/browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Live captions in the real desktop and mobile body editors
        run: node scripts/test-journal-captions.mjs 2>&1 | tee "$RUNNER_TEMP/journal-caption-browser.log"
      - name: Preserve existing writing and map stability
        run: node scripts/test-journal-editor-scroll.mjs 2>&1 | tee "$RUNNER_TEMP/journal-writing-browser.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-caption-browser-validation
          path: |
            ${{ runner.temp }}/journal-caption-*
            ${{ runner.temp }}/journal-writing-*
