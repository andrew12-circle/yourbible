name: Morning foundation workspace
on:
  push:
    branches: [codex/morning-personal-foundation]
    paths: [.github/workflows/morning-foundation-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.ref == 'refs/heads/codex/morning-personal-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: morning-foundation-test-placeholder
      VITE_SUPABASE_ANON_KEY: morning-foundation-test-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source transfer
        run: |
          mkdir -p /tmp/morning-workspace
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          parts = [pathlib.Path(f'scripts/morning-foundation-transfer.{n}').read_text().strip() for n in range(1, 5)]
          for n, part in enumerate(parts, 1):
              print(n, len(part), hashlib.sha256(part.encode()).hexdigest())
          encoded = ''.join(parts)
          pathlib.Path('/tmp/morning-workspace/received.txt').write_text(encoded)
          # Normalize two known transport transcription errors, then require the
          # exact locally-reviewed patch checksum before applying anything.
          encoded = encoded.replace('/enrz9dPLzux/enrz9dPLzuxfHQ', '/enrz9dPLzuxfHQ')
          encoded = encoded.replace('G2/7bWfvyp+fH+d11y', 'G2/7bWfvyp/fH+d11y')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'bd1a3f7302e992c0d1467eda972f76793cc86d2f6e05671faa2bf7d965cbf4f1', 'Source checksum mismatch'
          pathlib.Path('/tmp/morning-workspace/foundation.patch').write_bytes(patch)
          PY
      - name: Apply exact reviewed changes
        run: |
          git apply --check /tmp/morning-workspace/foundation.patch
          git apply /tmp/morning-workspace/foundation.patch
          git diff --check
          git add src docs/morning-personal-foundation.md scripts/verify-morning-foundation-ui.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Connect Morning Formula theme, real memories, scenes and daily action'
      - name: Commit to feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/codex/morning-personal-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Focused tests
        run: npx vitest run src/lib/livingHope/morningFoundation.test.ts src/hooks/useLivingHopeWorkbook.test.tsx src/components/living-hope/foundation
      - name: Changed code lint and size checks
        run: |
          npx eslint src/components/living-hope/foundation src/hooks/useLivingHopeWorkbook.ts src/hooks/useLivingHopeWorkbook.test.tsx src/lib/livingHope/morningFoundation.ts src/lib/livingHope/morningFoundation.test.ts src/pages/living-hope/MorningReviewPage.tsx
          node scripts/check-max-lines.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: morning-foundation-transfer-report
          path: /tmp/morning-workspace
          retention-days: 1
