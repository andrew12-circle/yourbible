name: Morning foundation workspace
on:
  push:
    branches: [codex/morning-personal-foundation]
    paths: [.github/workflows/morning-foundation-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.ref == 'refs/heads/codex/morning-personal-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: morning-foundation-test-placeholder
      VITE_SUPABASE_ANON_KEY: morning-foundation-test-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Integrate prayer practices without extra steps
        run: |
          python3 scripts/apply-morning-prayer-additions.py
          git diff --check
          git add src docs/morning-personal-foundation.md scripts/verify-morning-foundation-ui.mjs
          git rm scripts/apply-morning-prayer-additions.py scripts/morning-foundation-transfer.1 scripts/morning-foundation-transfer.2 scripts/morning-foundation-transfer.3 scripts/morning-foundation-transfer.4
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Integrate Worship prayer timer and separate angels recording; remove transfer files'
      - name: Commit to feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/codex/morning-personal-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Focused tests
        run: npx vitest run src/lib/livingHope/morningFoundation.test.ts src/lib/livingHope/morningWorshipPrayer.test.ts src/hooks/useLivingHopeWorkbook.test.tsx src/components/living-hope/foundation
      - name: Lint and size checks
        run: |
          npx eslint src/components/living-hope/foundation src/components/living-hope/PrayerVoiceRecording.tsx src/hooks/useLivingHopeWorkbook.ts src/lib/livingHope/morningFoundation.ts src/lib/livingHope/morningWorshipPrayer.ts src/pages/living-hope/MorningReviewPage.tsx
          node scripts/check-max-lines.mjs
      - name: Browser tooling
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps @playwright/test
          npx playwright install --with-deps chromium
      - name: Connected morning browser checks
        run: node scripts/verify-morning-foundation-ui.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: morning-foundation-prayer-checks
          path: artifacts/morning-foundation
          retention-days: 7
