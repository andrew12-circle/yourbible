name: Validate journal completeness repair
on:
  push:
    branches: [fix/journal-completeness-20260912]
    paths: ['.github/workflows/journal-completeness-apply.yml']
permissions:
  contents: write
concurrency:
  group: journal-completeness-apply
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/fix/journal-completeness-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: journal-test-placeholder
      VITE_SUPABASE_ANON_KEY: journal-test-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/journal-completeness-20260912
          fetch-depth: 0
      - name: Verify prepared source and apply exact patch
        run: |
          test "$(git branch --show-current)" = fix/journal-completeness-20260912
          git merge-base --is-ancestor 0ad7039f62b91d6463d4694d79d2e0b66e93c5b2 HEAD
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          text=''.join(Path(f'scripts/journal-phase2-part{n}.b64').read_text().strip() for n in range(4))
          # Correct a known transport transcription character before verifying the full digest.
          text=text.replace('Fa9ZZzBE/rW6', 'Fa9ZzBE/rW6')
          patch=gzip.decompress(base64.b64decode(text, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'ebe47ad096e19a003a7d82bd9d53bf0eb516655cc3ce1ae587b6056a61df596d', 'Prepared source checksum mismatch'
          Path('/tmp/journal-completeness.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/journal-completeness.patch
          git apply --index /tmp/journal-completeness.patch
          git diff --cached --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Journal, Reader Companion, and list-loader regression tests
        run: npm test -- src/lib/journal src/components/journal src/hooks/useJournalComposePersistence.test.tsx src/hooks/useJournalListController.test.tsx src/components/reader/CompanionJournalTab.test.tsx 2>&1 | tee "$RUNNER_TEMP/journal-tests.log"
      - name: Reject additional application type errors
        run: node scripts/check-journal-type-regressions.mjs 540dcad4ba42eea28e8bae655c1a11c8e8dc3419
      - name: Build complete application
        run: npm run build:dev 2>&1 | tee "$RUNNER_TEMP/journal-build.log"
      - name: Commit verified sources and remove one-time transport tooling
        run: |
          git rm .github/workflows/journal-inspection-bundle.yml .github/workflows/journal-completeness-apply.yml scripts/journal-phase2-part{0,1,2,3}.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(journal): private Companion drafts, complete exports, and full-history search'
          git push origin HEAD:fix/journal-completeness-20260912
          git rev-parse HEAD | tee "$RUNNER_TEMP/journal-verified-commit.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-completeness-validation
          path: ${{ runner.temp }}/journal-*.log
