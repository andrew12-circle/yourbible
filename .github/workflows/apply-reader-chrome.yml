name: Apply reader chrome update
on:
  push:
    branches: [fix/reader-running-heads-clean-navigation]
    paths: [.github/workflows/apply-reader-chrome.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checksum-verified changes to the inspected source
        shell: python
        run: |
          import base64, gzip, hashlib, json, pathlib, subprocess
          payload = ''
          packed = base64.b64decode(payload)
          assert hashlib.sha256(packed).hexdigest() == '0c12fa5e36c86bdc0695f62545ed1a52eb23091db829e46c28bb6a7d417859ac'
          data = json.loads(gzip.decompress(packed))
          for path, expected in data['base'].items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == expected, f'Source changed: {path}'
          for path, content in data['files'].items():
              target = pathlib.Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content)
          subprocess.run(['git', 'apply', '--check', '-'], input=data['patch'], text=True, check=True)
          subprocess.run(['git', 'apply', '-'], input=data['patch'], text=True, check=True)
          target = pathlib.Path('scripts/test-bible-chapter-continuation.mjs')
          source = target.read_text()
          anchor = 'async function inspect() {\n'
          assert source.count(anchor) == 1
          source = 'import { verifyReaderChromeGeometry } from "./reader-chrome-geometry.mjs";\n' + source.replace(anchor, anchor + '  await verifyReaderChromeGeometry(page);\n', 1)
          target.write_text(source)
          pathlib.Path('.github/workflows/apply-reader-chrome.yml').unlink()
      - run: npm ci
      - name: Focused header and navigation regressions
        run: npx vitest run src/pages/reader/ReaderPageChrome.test.tsx src/components/bible/ReaderMobileChapterBar.test.tsx src/lib/bible/readerRunningHead.test.ts
      - name: Commit only the requested source and tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/reader/ReaderPage.tsx src/pages/reader/ReaderPageChrome.tsx src/pages/reader/ReaderPageChrome.test.tsx src/components/bible/ReaderMobileChapterBar.tsx src/components/bible/ReaderMobileChapterBar.test.tsx src/lib/bible/readerRunningHead.ts src/lib/bible/readerRunningHead.test.ts scripts/reader-chrome-geometry.mjs scripts/test-bible-chapter-continuation.mjs .github/workflows/apply-reader-chrome.yml
          git diff --cached --check
          git commit -m 'Center print running heads and replace reader footer labels with unobtrusive page turns'
          git push origin HEAD:fix/reader-running-heads-clean-navigation
