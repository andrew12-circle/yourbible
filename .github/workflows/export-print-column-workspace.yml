name: Export print column workspace
on:
  push:
    branches: [fix/print-book-columns-20260927]
    paths: [.github/workflows/export-print-column-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            scripts
            .github
            .cursor
            public/bibles
            docs
      - name: Export tracked source only
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/source-sha.txt"
          tar --exclude='.git' -czf "$RUNNER_TEMP/source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: print-column-source
          path: |
            ${{ runner.temp }}/source.tar.gz
            ${{ runner.temp }}/source-sha.txt
          retention-days: 3
