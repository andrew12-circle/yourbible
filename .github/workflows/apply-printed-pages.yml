name: Apply printed-page source changes
on:
  push:
    branches: [fix/true-book-pages]
    paths: [.github/workflows/apply-printed-pages.yml]
permissions:
  contents: write
jobs:
  apply-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify and apply the reviewed source diff on the repair branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/true-book-pages
          echo '8643683dc2070510dc0db64b3910bdaf949824e12397f355018764b237b992c1  scripts/.printed-pages-01.patch' | sha256sum -c -
          echo '2d59692c6170f689815f0fee87eeadb46e46883817cdca6daf1ed969c5053187  scripts/.printed-pages-02.patch' | sha256sum -c -
          echo 'e7424ffce3e2b1b172d9e0a363d80fc5bd70fbf0a9544ab18609d3b4103098bd  scripts/.printed-pages-03.patch' | sha256sum -c -
          echo '4115f44efbdb4f138b555b3a2f1032a85af66ddc1eb4f9f2bc2e8e5eb8c51f9a  scripts/.printed-pages-04.patch' | sha256sum -c -
          git apply --unidiff-zero --check scripts/.printed-pages-0*.patch
          git apply --unidiff-zero --index scripts/.printed-pages-0*.patch
          git rm scripts/.printed-pages-0*.patch
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Paginate Scripture at word boundaries and remove page-mode escape prompt'
          test "$(git ls-remote origin refs/heads/fix/true-book-pages | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/fix/true-book-pages
