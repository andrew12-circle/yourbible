name: Bible short-chapter continuation
on:
  push:
    branches: [main, fix/reader-short-chapter-continuation]
    paths: ['src/hooks/useReader*', 'src/lib/bible/**', 'src/components/bible/**', 'src/pages/reader/**', 'scripts/test-bible-chapter-continuation.mjs', '.github/workflows/bible-short-chapters.yml']
  pull_request:
    paths: ['src/hooks/useReader*', 'src/lib/bible/**', 'src/components/bible/**', 'src/pages/reader/**', 'scripts/test-bible-chapter-continuation.mjs', '.github/workflows/bible-short-chapters.yml']
permissions:
  contents: read
concurrency:
  group: short-chapters-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: reader-test-placeholder
  VITE_SUPABASE_ANON_KEY: reader-test-placeholder
defaults:
  run:
    shell: bash
jobs:
  psalms:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/reader-playwright" --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/reader-playwright/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Psalms fill both pages without an artificial chapter stop
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/reader-playwright/node_modules/playwright/index.mjs
          READER_BROWSER: ${{ matrix.browser }}
          READER_TEST_BOOK: Psa
          READER_TEST_CHAPTER: '6'
          READER_TEST_END_CHAPTER: '26'
        run: node scripts/test-bible-chapter-continuation.mjs 2>&1 | tee "$RUNNER_TEMP/short-chapters.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-chapters-${{ matrix.browser }}
          path: |
            ${{ runner.temp }}/chapter-flow*.png
            ${{ runner.temp }}/chapter-flow*.json
            ${{ runner.temp }}/short-chapters.log
