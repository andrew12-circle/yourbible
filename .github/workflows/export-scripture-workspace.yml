name: Export Scripture repair workspace
on:
  push:
    branches: [fix/scripture-fidelity-20260924]
    paths: [.github/workflows/export-scripture-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            scripts
            docs
            supabase
            .github
            public/bibles
      - name: Pack tracked source only, without credentials
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/source-sha.txt"
          git ls-files -z src scripts docs supabase .github public/bibles '*.json' '*.ts' '*.js' '*.mjs' '*.cjs' '*.html' '*.css' '*.md' | tar --null -T - --ignore-failed-read -czf "$RUNNER_TEMP/scripture-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: scripture-repair-workspace
          path: |
            ${{ runner.temp }}/source-sha.txt
            ${{ runner.temp }}/scripture-source.tar.gz
          retention-days: 3
