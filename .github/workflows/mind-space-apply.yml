name: Apply spatial mind map implementation
on:
  push:
    branches: [fix/mind-space-20260919]
    paths: ['.github/workflows/mind-space-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate and apply exact reviewed source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib, json
          parts = sorted(Path('scripts').glob('mind-space-implementation.part-*'))
          assert len(parts) == 4
          raw = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts)))
          assert hashlib.sha256(raw).hexdigest() == '10d4f90c083d4b2d7b11bb2dfcccec7446b40bf5838d6d1c435729b315e9d793', 'Implementation checksum mismatch'
          output = {}
          for filename, change in json.loads(raw).items():
              path = Path(filename)
              assert not path.is_absolute() and '..' not in path.parts
              if change['before'] is None:
                  assert not path.exists(), 'Unexpected existing file: '+filename
                  old = b''
              else:
                  old = path.read_bytes()
                  assert hashlib.sha256(old).hexdigest() == change['before'], 'Source changed: '+filename
              lines = old.decode().splitlines(keepends=True)
              for start, end, text in reversed(change['edits']):
                  lines[start:end] = text.splitlines(keepends=True)
              output[path] = ''.join(lines)
          for path, text in output.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text)
          print('Applied', len(output), 'source-verified files')
          PY
          git rm scripts/mind-space-implementation.part-*
          git add src/components/graph src/lib/graph src/hooks/useMindGraphData.ts src/hooks/useMindGraphData.test.tsx scripts/test-mind-space.mjs docs/mind-space.md
          git diff --cached --check
          git -c user.name='Andrew Heisley' -c user.email='andrew12-circle@users.noreply.github.com' commit -m 'feat(graph): add immersive spatial mind map with real connection tracing'
          git push origin HEAD:fix/mind-space-20260919
