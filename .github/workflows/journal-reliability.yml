name: Journal reliability
on:
  push:
    branches: [main, 'fix/journal-*']
    paths:
      - 'src/**'
      - 'supabase/functions/journal-*/**'
      - 'supabase/functions/_shared/journal*.ts'
      - 'supabase/migrations/*journal*.sql'
      - 'scripts/check-journal-type-regressions.mjs'
      - 'scripts/journal-diagnostic-*'
      - 'package*.json'
      - '.github/workflows/journal-reliability.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/functions/journal-*/**'
      - 'supabase/functions/_shared/journal*.ts'
      - 'supabase/migrations/*journal*.sql'
      - 'scripts/check-journal-type-regressions.mjs'
      - 'scripts/journal-diagnostic-*'
      - 'package*.json'
      - '.github/workflows/journal-reliability.yml'
permissions:
  contents: read
concurrency:
  group: journal-reliability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: journal-test-placeholder
      VITE_SUPABASE_ANON_KEY: journal-test-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Journal and related UI regression tests
        id: tests
        continue-on-error: true
        run: npm test -- src/lib/journal src/components/journal src/hooks/useJournalComposePersistence.test.tsx src/hooks/useJournalListController.test.tsx src/components/reader/CompanionJournalTab.test.tsx 2>&1 | tee "$RUNNER_TEMP/journal-tests.log"
      - name: No new TypeScript diagnostics versus audited baseline
        id: types
        continue-on-error: true
        run: node scripts/check-journal-type-regressions.mjs 540dcad4ba42eea28e8bae655c1a11c8e8dc3419
      - name: Production build and release artifact checks
        id: build
        continue-on-error: true
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/journal-build.log"
      - name: Full repository test suite report
        id: full_tests
        continue-on-error: true
        run: npm test 2>&1 | tee "$RUNNER_TEMP/journal-full-tests.log"
      - name: Full repository lint report
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee "$RUNNER_TEMP/journal-lint.log"
      - name: Record exact source and outcomes for review
        if: always()
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/journal-verified-commit.log"
          git diff --binary 0ad7039f62b91d6463d4694d79d2e0b66e93c5b2 HEAD -- src supabase scripts docs > "$RUNNER_TEMP/journal-reviewed-changes.patch"
          {
            echo 'Journal tests: ${{ steps.tests.outcome }}'
            echo 'Type comparison: ${{ steps.types.outcome }}'
            echo 'Production build: ${{ steps.build.outcome }}'
            echo 'Full repository tests: ${{ steps.full_tests.outcome }}'
            echo 'Full repository lint: ${{ steps.lint.outcome }}'
          } | tee "$RUNNER_TEMP/journal-outcomes.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-reliability-validation
          path: |
            ${{ runner.temp }}/journal-*.log
            ${{ runner.temp }}/journal-reviewed-changes.patch
      - name: Enforce journal validation results
        if: always()
        run: |
          test '${{ steps.tests.outcome }}' = success
          test '${{ steps.types.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
          # Full-repository debt is reported separately and must be reviewed before merging.
