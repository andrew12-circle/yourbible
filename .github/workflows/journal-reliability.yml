name: Journal reliability
on:
  push:
    branches: [main, fix/journal-reliability-20260912]
    paths:
      - 'src/**'
      - 'supabase/functions/journal-*/**'
      - 'supabase/functions/_shared/journal*.ts'
      - 'scripts/check-journal-type-regressions.mjs'
      - 'package*.json'
      - '.github/workflows/journal-reliability.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/functions/journal-*/**'
      - 'supabase/functions/_shared/journal*.ts'
      - 'scripts/check-journal-type-regressions.mjs'
      - 'package*.json'
      - '.github/workflows/journal-reliability.yml'
permissions:
  contents: read
concurrency:
  group: journal-reliability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: journal-test-placeholder
      VITE_SUPABASE_ANON_KEY: journal-test-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Journal and compose-hook regression tests
        id: tests
        continue-on-error: true
        run: npm test -- src/lib/journal src/components/journal src/hooks/useJournalComposePersistence.test.tsx 2>&1 | tee "$RUNNER_TEMP/journal-tests.log"
      - name: No new TypeScript diagnostics versus audited baseline
        id: types
        continue-on-error: true
        run: node scripts/check-journal-type-regressions.mjs 540dcad4ba42eea28e8bae655c1a11c8e8dc3419
      - name: Application development build
        id: build
        continue-on-error: true
        run: npm run build:dev 2>&1 | tee "$RUNNER_TEMP/journal-build.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-reliability-validation
          path: ${{ runner.temp }}/journal-*.log
      - name: Enforce validation results
        if: always()
        run: |
          echo 'Journal tests: ${{ steps.tests.outcome }}'
          echo 'Type regression comparison: ${{ steps.types.outcome }}'
          echo 'Development build: ${{ steps.build.outcome }}'
          test '${{ steps.tests.outcome }}' = success
          test '${{ steps.types.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
