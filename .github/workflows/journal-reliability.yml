name: Journal reliability

on:
  push:
    branches: [main, fix/journal-reliability-20260912]
    paths:
      - 'src/**'
      - 'supabase/functions/journal-*/**'
      - 'package*.json'
      - 'vitest.config.*'
      - '.github/workflows/journal-reliability.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/functions/journal-*/**'
      - 'package*.json'
      - 'vitest.config.*'
      - '.github/workflows/journal-reliability.yml'

permissions:
  contents: read

concurrency:
  group: journal-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: journal-test-placeholder
      VITE_SUPABASE_ANON_KEY: journal-test-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Journal regression tests
        run: npm test -- src/lib/journal src/components/journal
