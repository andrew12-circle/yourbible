name: Mark reader reflow readiness truthfully
on:
  push:
    branches: [fix/reader-short-chapter-continuation]
    paths: [.github/workflows/apply-reader-layout-ready.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/fix/reader-short-chapter-continuation
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/reader/ReaderPage.tsx')
          text = p.read_text()
          old = 'aria-busy={chapterNavigationPending || loadingPassage || continuationFilling}'
          new = 'aria-busy={chapterNavigationPending || loadingPassage || continuationFilling || (!scrollMode && verses.length > 0 && !(useStreamReader ? streamSplitsReady : splitsReady))}'
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          p = Path('scripts/test-bible-chapter-continuation.mjs')
          text = p.read_text()
          old = '  await page.waitForTimeout(500);'
          assert text.count(old) == 1
          text = 'import { waitForReaderLayout } from "./reader-browser-settled.mjs";\n' + text.replace(old, '  await waitForReaderLayout(page);')
          p.write_text(text)
          PY
          node --check scripts/test-bible-chapter-continuation.mjs
          node --check scripts/reader-browser-settled.mjs
          git add -- src/pages/reader/ReaderPage.tsx scripts/test-bible-chapter-continuation.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Expose pending pagination to assistive technology and await stable layout in browser tests'
          test "$(git ls-remote origin refs/heads/fix/reader-short-chapter-continuation | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/fix/reader-short-chapter-continuation
