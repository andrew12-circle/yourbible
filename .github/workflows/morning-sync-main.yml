name: Reconcile Morning Formula with main
on:
  push:
    branches: [codex/morning-personal-foundation]
    paths: [.github/workflows/morning-sync-main.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 64
      - name: Merge the reviewed main revision into this feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags --depth=8 origin 1307b4dbdc3b21d0a38073e3e0fea9825fc3e679
          git merge --no-commit --no-ff 1307b4dbdc3b21d0a38073e3e0fea9825fc3e679 || test -f .git/MERGE_HEAD
          python3 - <<'PY'
          import pathlib, re, subprocess
          conflicts = subprocess.check_output(['git','diff','--name-only','--diff-filter=U'], text=True).splitlines()
          allowed = {'src/components/living-hope/PrayerVoiceRecording.tsx','src/components/living-hope/MorningGuidedExperience.tsx','src/components/living-hope/MorningRitualStepPanels.tsx','src/lib/livingHope/workbookTypes.ts','src/pages/living-hope/MorningReviewPage.tsx'}
          assert set(conflicts) <= allowed, conflicts
          pattern = re.compile(r'^<<<<<<<[^\n]*\n(.*?)^=======\n(.*?)^>>>>>>>[^\n]*\n', re.M | re.S)
          for filename in conflicts:
              path = pathlib.Path(filename)
              if filename.endswith('/PrayerVoiceRecording.tsx'):
                  content = subprocess.check_output(['git','show',f'HEAD:{filename}'], text=True)
                  old = '  prayerKey: "surrender" | "covering" | "angels";'
                  assert content.count(old) == 1
                  content = 'import type { PrayerRecordingKey } from "@/lib/livingHope/workbookTypes";\n' + content.replace(old, '  prayerKey: PrayerRecordingKey | "angels";')
              else:
                  content = path.read_text()
                  def resolve(match):
                      ours, theirs = match.groups()
                      lines = [line for line in (ours + theirs).splitlines() if line.strip()]
                      if lines and all(line.startswith('import ') for line in lines):
                          return '\n'.join(dict.fromkeys(lines)) + '\n'
                      if filename.endswith('/MorningRitualStepPanels.tsx') and 'MorningHopePrayer' in ours and theirs.strip() == '</div>':
                          return ours.replace('</>', '</div>')
                      raise AssertionError((filename, ours, theirs))
                  content = pattern.sub(resolve, content)
              assert '<<<<<<<' not in content and '>>>>>>>' not in content, filename
              path.write_text(content)
              subprocess.run(['git','add',filename], check=True)
          assert not subprocess.check_output(['git','diff','--name-only','--diff-filter=U'], text=True).strip()
          for filename in ['src/components/living-hope/MorningGuidedExperience.tsx','src/components/living-hope/MorningRitualStepPanels.tsx']:
              text = pathlib.Path(filename).read_text()
              assert all(token in text for token in ['MorningDayAheadPrayer','MorningWorshipPractice','MorningAngelsPrayer','MorningRealMemories']), filename
          workbook = pathlib.Path('src/lib/livingHope/workbookTypes.ts').read_text()
          assert all(token in workbook for token in ['day_ahead_prayer','morning_foundation','morning_memories','PrayerRecordingKey'])
          for filename in ['src/lib/bible/redLetter.ts','src/lib/livingHope/dayAheadPrayer.ts','src/components/living-hope/MorningDayAheadPrayer.tsx']:
              expected = subprocess.check_output(['git','rev-parse',f'1307b4dbdc3b21d0a38073e3e0fea9825fc3e679:{filename}'], text=True).strip()
              actual = subprocess.check_output(['git','hash-object',filename], text=True).strip()
              assert actual == expected, filename
          PY
          git diff --check
          git commit --no-edit
      - name: Push to feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/codex/morning-personal-foundation
      - name: Capture any unresolved context
        if: ${{ failure() }}
        run: |
          mkdir -p /tmp/morning-merge
          git status --short > /tmp/morning-merge/status.txt
          git diff > /tmp/morning-merge/conflicts.diff
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: morning-merge-context
          path: /tmp/morning-merge
          retention-days: 1
