name: Visual preview review
on:
  push:
    branches: ['feat/masterworks-atlas-collections']
    paths: ['scripts/visual-bible/fetch-previews.mjs', '.github/workflows/visual-preview-review.yml']
permissions:
  contents: read
  actions: read
jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: visual-collection-research
          run-id: 36009433634
          github-token: ${{ github.token }}
          path: visual-review
      - name: Fetch bounded image previews from the Foundation's thumbnail domain
        run: node scripts/visual-bible/fetch-previews.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-collection-reviewed-previews
          path: visual-review/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
