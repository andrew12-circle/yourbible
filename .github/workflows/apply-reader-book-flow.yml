name: Apply verified reader repair
on:
  push:
    branches: ['fix/bible-open-book-flow']
    paths: ['.github/reader-repair/**', '.github/workflows/apply-reader-book-flow.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/bible-open-book-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bible-open-book-flow
      - name: Verify and apply exact source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/pages/reader/ReaderPage.tsx)" = 229a024bab70d4f8e0f8e1c7d2e45c838429f3f4
          cat .github/reader-repair/part{1,2,3}.xz > "$RUNNER_TEMP/reader-repair.xz"
          echo '370b17b5562968e46be6c9ac17f077541adf9f3c3a2b492465094f476ec41d90  '"$RUNNER_TEMP/reader-repair.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/reader-repair.xz" > "$RUNNER_TEMP/reader-repair.patch"
          git apply --check --exclude='.github/*' "$RUNNER_TEMP/reader-repair.patch"
          git apply --exclude='.github/*' "$RUNNER_TEMP/reader-repair.patch"
          git diff --check
          git add src scripts/test-bible-book-flow.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix facing-page text fit and replace scrolling recovery with repagination'
          git push origin HEAD:refs/heads/fix/bible-open-book-flow
