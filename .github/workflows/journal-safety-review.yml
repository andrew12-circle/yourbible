name: Journal safety repair workspace
on:
  push:
    branches: ['work/journal-safety-1-4-20260918']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2acb9769388c5a8c6b44c750e340ae9caf377a10
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --save-dev --save-exact fake-indexeddb@6.2.4
      - name: Package transaction test dependency and exact lock
        shell: bash
        run: tar -czf "$RUNNER_TEMP/journal-safety-idb.tar.gz" node_modules/fake-indexeddb package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: journal-safety-idb
          path: ${{ runner.temp }}/journal-safety-idb.tar.gz
