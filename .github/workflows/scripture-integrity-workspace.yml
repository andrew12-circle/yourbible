name: Scripture integrity workspace
on:
  push:
    branches: [fix/scripture-source-integrity]
    paths: [.github/workflows/scripture-integrity-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked application and test source only
        shell: bash
        run: |
          git archive --format=tar.gz HEAD src scripts supabase docs .github package.json package-lock.json index.html vite.config.ts tsconfig.json tsconfig.app.json tsconfig.node.json tailwind.config.ts postcss.config.js eslint.config.js public/bible public/bible-plates > "$RUNNER_TEMP/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/source-sha.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: scripture-integrity-source
          path: |
            ${{ runner.temp }}/source.tar.gz
            ${{ runner.temp }}/source-sha.txt
          retention-days: 1
