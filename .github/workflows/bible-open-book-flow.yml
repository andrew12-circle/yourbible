name: Bible open-book flow
on:
  push:
    branches: [main, 'fix/bible-open-book-flow']
    paths: ['src/hooks/useReader*', 'src/components/bible/**', 'src/pages/reader/**', 'src/lib/bible/**', 'scripts/test-bible-book-flow.mjs', '.github/workflows/bible-open-book-flow.yml']
  pull_request:
    paths: ['src/hooks/useReader*', 'src/components/bible/**', 'src/pages/reader/**', 'src/lib/bible/**', 'scripts/test-bible-book-flow.mjs', '.github/workflows/bible-open-book-flow.yml']
permissions:
  contents: read
env:
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: reader-test-placeholder
  VITE_SUPABASE_ANON_KEY: reader-test-placeholder
defaults:
  run:
    shell: bash
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node scripts/check-journal-type-regressions.mjs a071419454cc9a7a68608afb75668dfe642fd799
  book-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/reader-playwright" --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/reader-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real-reader visible fit and open-book flow
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/reader-playwright/node_modules/playwright/index.mjs
        run: |
          node scripts/test-bible-reader.mjs 2>&1 | tee "$RUNNER_TEMP/reader-browser.log"
          node scripts/test-bible-book-flow.mjs 2>&1 | tee "$RUNNER_TEMP/book-flow.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-book-flow-evidence
          path: |
            ${{ runner.temp }}/reader-browser.log
            ${{ runner.temp }}/bible-reader-*.png
            ${{ runner.temp }}/bible-reader-results.json
            ${{ runner.temp }}/book-flow.log
            ${{ runner.temp }}/book-flow-*.png
            ${{ runner.temp }}/book-flow-*.json
