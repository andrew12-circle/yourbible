name: Bind reader prefix cache identity
on:
  push:
    branches: ['fix/bible-open-book-flow']
    paths: ['.github/workflows/reader-prefix-cache-key.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/bible-open-book-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bible-open-book-flow
      - shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/pages/reader/ReaderPage.tsx)" = 5a7bbc3cb706d0a4f594cd13358c9fdf7269022f
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/reader/ReaderPage.tsx')
          s=p.read_text()
          edits=[
            ('  const singlePaginationKey = useMemo(() => [','  const fitPrefixKey = fitCorrection.prefix.splits.join(",");\n  const singlePaginationKey = useMemo(() => ['),
            ('readerFontRevision, fitCorrection.reserve, pageBox.w','readerFontRevision, fitCorrection.reserve, fitPrefixKey, pageBox.w'),
            ('    fitCorrection.reserve,\n    readerFontRevision,','    fitCorrection.reserve,\n    fitPrefixKey,\n    readerFontRevision,'),
            ('  const requestPageFitCorrection = useCallback','  const { requestCorrection } = fitCorrection;\n  const requestPageFitCorrection = useCallback'),
            ('    fitCorrection.requestCorrection(overflowPx, {','    requestCorrection(overflowPx, {'),
            ('splits, fitCorrection.requestCorrection, fitContentKey','splits, requestCorrection, fitContentKey'),
          ]
          for before,after in edits:
            assert before in s,before
            s=s.replace(before,after)
          p.write_text(s)
          PY
          test "$(git hash-object src/pages/reader/ReaderPage.tsx)" = 7b0bd58f7d7a77a01511043cb0adb260d60b25c4
          git diff --check
          git rm .github/workflows/reader-prefix-cache-key.yml
          git add src/pages/reader/ReaderPage.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep corrected page allocations separate in the measurement cache'
          git push origin HEAD:refs/heads/fix/bible-open-book-flow
