name: Apply forward-only reader correction
on:
  push:
    branches: ['fix/bible-open-book-flow']
    paths: ['.github/workflows/apply-reader-prefix.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/bible-open-book-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bible-open-book-flow
      - name: Apply checksum-verified source patch and remove this temporary workflow
        shell: bash
        env:
          PATCH_BASE64: 
        run: |
          set -euo pipefail
          test "$(git hash-object src/pages/reader/ReaderPage.tsx)" = fccc25c8ac11e4beaf23892e5e7edb60218cdcad
          python3 - <<'PY'
          import os,base64,lzma,hashlib,pathlib
          data=base64.b64decode(os.environ['PATCH_BASE64'])
          assert hashlib.sha256(data).hexdigest()=='24b0383bd2eef59d7f62f6b7e753f8c717e777dd7da1d12685792c6e0f305a04'
          pathlib.Path('/tmp/reader-prefix.patch').write_bytes(lzma.decompress(data))
          PY
          git apply --check /tmp/reader-prefix.patch
          git apply /tmp/reader-prefix.patch
          git diff --check
          git rm .github/workflows/apply-reader-prefix.yml
          git add src
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep read page boundaries stable when correcting the unread spread'
          git push origin HEAD:refs/heads/fix/bible-open-book-flow
