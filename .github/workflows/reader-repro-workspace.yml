name: Reader reproduction workspace
on:
  push:
    branches: [fix/bible-continuous-chapter-flow]
    paths: [.github/workflows/reader-repro-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive HEAD src scripts docs .cursor supabase .github AGENTS.md package.json package-lock.json vite.config.ts vitest.config.ts tsconfig.json tsconfig.app.json tsconfig.node.json tailwind.config.ts postcss.config.js eslint.config.js index.html public/bible-plates public/bibles | gzip > "$RUNNER_TEMP/current-reader-source.tar.gz"
      - name: Browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/reader-tools" --no-package-lock playwright@1.55.0
          tar -czf "$RUNNER_TEMP/reader-tools.tar.gz" -C "$RUNNER_TEMP/reader-tools" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: current-reader-workspace
          path: |
            ${{ runner.temp }}/current-reader-source.tar.gz
            ${{ runner.temp }}/reader-tools.tar.gz
          retention-days: 1
